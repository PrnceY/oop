<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Expense Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.dashboard') }}">Expense Tracker</a>
    {% if session.get('user_id') %}
    <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <span class="muted">{{ session['username'] }}</span>
      <button class="btn ghost" type="submit">Log out</button>
    </form>
    {% endif %}
  </header>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
